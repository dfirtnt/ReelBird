name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: reelbird_test
          POSTGRES_USER: reelbird
          POSTGRES_PASSWORD: reelbird_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
    
    - name: Install AI worker dependencies
      run: |
        cd ai-worker
        pip install -r requirements.txt
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run backend tests
      run: |
        cd backend
        npm test
      env:
        DATABASE_URL: postgresql://reelbird:reelbird_test@localhost:5432/reelbird_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
    
    - name: Install Playwright browsers
      run: |
        cd backend
        npx playwright install --with-deps
    
    - name: Run E2E tests
      run: |
        cd backend
        npm run test:e2e
      env:
        DATABASE_URL: postgresql://reelbird:reelbird_test@localhost:5432/reelbird_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: backend/playwright-report/
        retention-days: 30
    
    - name: Upload trace files
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-traces
        path: backend/test-results/
        retention-days: 30

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Run security audit (backend)
      run: |
        cd backend
        npm audit --audit-level=moderate
    
    - name: Run security audit (frontend)
      run: |
        cd frontend
        npm audit --audit-level=moderate

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker images
      run: |
        docker-compose build
    
    - name: Test Docker containers
      run: |
        docker-compose up -d
        sleep 30
        curl -f http://localhost:3001/health || exit 1
        curl -f http://localhost:3000 || exit 1
        docker-compose down

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deployment would happen here"
        echo "Configure your deployment target (AWS, GCP, Azure, etc.)"